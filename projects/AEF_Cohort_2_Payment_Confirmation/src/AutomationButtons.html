<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { margin:0; padding:16px; font-family:Segoe UI,Arial,sans-serif; background:#f6f8fc; color:#0f172a; }
      .card { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:14px; }
      h2 { margin:0 0 8px; font-size:17px; }
      p { margin:0 0 12px; font-size:13px; color:#475569; line-height:1.5; }
      .btn { width:100%; border:0; border-radius:8px; padding:10px 12px; margin:0 0 8px; font-size:13px; font-weight:600; cursor:pointer; }
      .primary { background:#1d4ed8; color:#fff; }
      .neutral { background:#0f766e; color:#fff; }
      .warn { background:#475569; color:#fff; }
      .danger { background:#b91c1c; color:#fff; }
      .input { width:100%; box-sizing:border-box; border:1px solid #cbd5e1; border-radius:8px; padding:10px 12px; margin:0 0 8px; font-size:13px; }
      .status { margin-top:10px; min-height:18px; font-size:12px; color:#334155; }
      .error { color:#b91c1c; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>AEF Cohort 2 Payment Confirmation</h2>
      <p>Set up the tracking columns, preview or test the email, and safely process confirmed payments.</p>

      <button class="btn primary" onclick="runAction('setupAefPaymentConfirmationAutomation')">Setup Payment Confirmation Automation</button>
      <input id="testEmail" class="input" type="email" placeholder="test@email.com" />
      <button class="btn primary" onclick="saveTestEmail()">Save Test Email Recipient</button>
      <button class="btn warn" onclick="runAction('previewAefPaymentConfirmationEmail')">Preview Payment Confirmation Email</button>
      <button class="btn warn" onclick="runAction('sendAefPaymentConfirmationTestEmail')">Send Test Payment Confirmation Email</button>
      <button class="btn neutral" onclick="runAction('previewPendingAefPaymentRows')">Preview Pending Confirmed Rows</button>
      <button class="btn primary" onclick="runAction('sendPendingAefPaymentConfirmations')">Send Pending Payment Emails</button>
      <button class="btn neutral" onclick="runAction('installAefPaymentConfirmationTriggers')">Install Auto Trigger</button>
      <button class="btn danger" onclick="runAction('clearAefPaymentConfirmationTriggers')">Clear Auto Trigger</button>

      <div id="status" class="status"></div>
    </div>

    <script>
      function setStatus(message, isError) {
        var status = document.getElementById("status");
        status.textContent = message || "";
        status.className = isError ? "status error" : "status";
      }

      function runAction(functionName) {
        setStatus("Running ...", false);
        google.script.run
          .withSuccessHandler(function (message) {
            setStatus(message || "Completed.", false);
          })
          .withFailureHandler(function (error) {
            setStatus(error && error.message ? error.message : String(error), true);
          })[functionName]();
      }

      function saveTestEmail() {
        var email = document.getElementById("testEmail").value;
        setStatus("Saving ...", false);
        google.script.run
          .withSuccessHandler(function (savedEmail) {
            setStatus("Saved: " + savedEmail, false);
          })
          .withFailureHandler(function (error) {
            setStatus(error && error.message ? error.message : String(error), true);
          })
          .saveAefPaymentTestEmailRecipient(email);
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: Segoe UI, Arial, sans-serif;
        background: #f6f8fc;
        color: #0f172a;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 14px;
      }
      h2 {
        margin: 0 0 8px 0;
        font-size: 17px;
      }
      p {
        margin: 0 0 12px 0;
        font-size: 13px;
        color: #475569;
      }
      .btn {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        margin: 0 0 8px 0;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary { background: #1d4ed8; color: #ffffff; }
      .btn-neutral { background: #0f766e; color: #ffffff; }
      .btn-warn { background: #475569; color: #ffffff; }
      .btn-danger { background: #b91c1c; color: #ffffff; }
      .status {
        margin-top: 10px;
        min-height: 18px;
        font-size: 12px;
        color: #334155;
      }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>AI Agents Automation</h2>
      <p>Use these buttons to setup and run the registration automation.</p>

      <button class="btn btn-primary" onclick="runAction('setupRegistrationAutomation')">
        Setup Automation + Triggers
      </button>
      <button class="btn btn-neutral" onclick="runAction('refreshReviewTracking')">
        Refresh Review Tracking
      </button>
      <button class="btn btn-neutral" onclick="runAction('refreshColorGuide')">
        Refresh Color Guide
      </button>
      <input id="testEmail" type="email" placeholder="test@email.com" style="width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;margin:0 0 8px 0;font-size:13px;" />
      <button class="btn btn-primary" onclick="saveTestEmail()">
        Save Test Email Recipient
      </button>
      <button class="btn btn-neutral" onclick="runAction('installRegistrationTrigger')">
        Install Auto Triggers
      </button>
      <button class="btn btn-danger" onclick="runAction('clearRegistrationTrigger')">
        Clear Auto Triggers
      </button>
      <button class="btn btn-neutral" onclick="runAction('processExistingRegistrations')">
        Process Existing Rows
      </button>
      <button class="btn btn-primary" onclick="runAction('sendAcceptedEmails')">
        Send Accepted Emails
      </button>
      <button class="btn btn-warn" onclick="runAction('sendAcceptedTestEmail')">
        Send Test Accepted Email
      </button>
      <button class="btn btn-primary" onclick="runAction('sendAcceptedReminderEmails')">
        Send Accepted Reminder Emails
      </button>
      <button class="btn btn-warn" onclick="runAction('sendAcceptedReminderTestEmail')">
        Send Test Accepted Reminder Email
      </button>
      <button class="btn btn-danger" onclick="runAction('sendRejectedEmails')">
        Send Rejected Emails
      </button>
      <button class="btn btn-warn" onclick="runAction('sendRejectedTestEmail')">
        Send Test Rejected Email
      </button>
      <button class="btn btn-warn" onclick="runAction('sendRegistrationTestEmail')">
        Send Test Registration Email
      </button>

      <div id="status" class="status"></div>
    </div>

    <script>
      function setStatus(message, isError) {
        var status = document.getElementById("status");
        status.textContent = message || "";
        status.className = isError ? "status error" : "status";
      }

      function runAction(functionName) {
        setStatus("Running " + functionName + " ...", false);
        google.script.run
          .withSuccessHandler(function () {
            setStatus(functionName + " completed.", false);
          })
          .withFailureHandler(function (error) {
            var msg = error && error.message ? error.message : String(error);
            setStatus(msg, true);
          })[functionName]();
      }

      function saveTestEmail() {
        var email = document.getElementById("testEmail").value;
        setStatus("Saving test email recipient ...", false);
        google.script.run
          .withSuccessHandler(function (savedEmail) {
            setStatus("Saved: " + savedEmail, false);
          })
          .withFailureHandler(function (error) {
            var msg = error && error.message ? error.message : String(error);
            setStatus(msg, true);
          })
          .saveTestEmailRecipient(email);
      }
    </script>
  </body>
</html>
